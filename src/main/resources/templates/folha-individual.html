<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173e39">
    <title>Demonstrativo individual | Folha Clara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: navigation}"></header>
<main class="page-shell individual-shell">
    <a class="back-link" th:href="@{/}"><span aria-hidden="true">←</span> Voltar aos colaboradores</a>
    <section class="page-heading reveal">
        <div><p class="eyebrow">DEMONSTRATIVO INDIVIDUAL <span></span> <span th:text="${colaborador.matricula}">MATRÍCULA</span></p><h1 th:text="${colaborador.nome}">Nome do colaborador</h1><p class="heading-copy" th:text="${colaborador.tipo} + ' · ' + ${colaborador.detalhesRemuneracao}">Tipo de remuneração</p></div>
        <button class="button button-outline print-button" type="button" onclick="window.print()">Imprimir demonstrativo</button>
    </section>
    <section class="individual-report reveal">
        <div class="individual-line"><span>Salário base</span><strong th:text="${@formatadorMoeda.formatar(colaborador.salarioBase)}">R$ 0,00</strong></div>
        <div class="individual-line"><span>Adicionais</span><strong th:text="${@formatadorMoeda.formatar(colaborador.adicional)}">R$ 0,00</strong></div>
        <div class="individual-total"><span>Salário final</span><strong th:text="${@formatadorMoeda.formatar(colaborador.salarioFinal)}">R$ 0,00</strong></div>
    </section>
    <div class="individual-actions"><a class="button button-quiet" th:href="@{/}">Fechar</a><a class="button button-primary" th:href="@{/colaboradores/{matricula}/editar(matricula=${colaborador.matricula})}">Editar cadastro</a></div>
</main>
<footer class="site-footer"><span>Folha Clara</span><span>Demonstrativo individual</span></footer>
</body>
</html>
